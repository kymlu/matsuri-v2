name: Deploy on File Intake

on:
  push:
    branches:
      - master
    paths:
      - 'intake/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Manage files
        run: npm run manage

      - name: Deploy site
        run: npm run deploy